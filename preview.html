<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06050d"><title>一束花开</title><style>:root{--gold:#e9b45c;--soft:#f3deb0;--line:rgba(212,175,90,.22)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06050d}body{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:var(--soft)}.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 38%,rgba(90,47,78,.20),transparent 38%),radial-gradient(circle at 50% 70%,rgba(30,42,74,.18),transparent 44%),#06050d}.stars{position:fixed;inset:0;opacity:.25;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.2px);background-size:71px 71px;mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 80%,transparent)}main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(92vw,520px);padding:30px 28px 26px;border:1px solid var(--line);border-radius:20px;background:rgba(10,8,18,.64);backdrop-filter:blur(18px);box-shadow:0 18px 70px rgba(0,0,0,.48)}h1{margin:0 0 8px;text-align:center;font-size:15px;letter-spacing:.48em;text-indent:.48em;font-weight:600;color:rgba(243,222,176,.78)}.sub{text-align:center;font-size:10px;letter-spacing:.24em;color:rgba(243,222,176,.36);margin-bottom:22px}.styles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.style{border:1px solid rgba(212,175,90,.16);background:rgba(233,180,92,.045);border-radius:15px;padding:15px 12px;color:var(--soft);text-align:left;font-family:inherit;cursor:pointer}.style.active{border-color:rgba(233,180,92,.58);background:rgba(233,180,92,.12);box-shadow:0 0 24px rgba(233,180,92,.07) inset}.style span{font-size:22px;display:block;margin-bottom:7px}.style b{display:block;font-size:13px;letter-spacing:.08em}.style small{display:block;margin-top:5px;color:rgba(243,222,176,.42);font:10px/1.5 system-ui}.row{display:flex;gap:10px}.row input{flex:1;min-width:0;height:46px;border:0;outline:0;border-radius:11px;text-align:center;background:rgba(233,180,92,.07);color:var(--soft);font:600 16px inherit;letter-spacing:.1em;caret-color:var(--gold)}.row input::placeholder{color:rgba(243,222,176,.28)}.row button{height:46px;padding:0 18px;border-radius:11px;border:1px solid rgba(224,182,102,.5);background:rgba(224,182,102,.12);color:#efd9a4;font-family:inherit;font-size:13px;letter-spacing:.16em}.tip{margin-top:16px;text-align:center;font-size:9px;letter-spacing:.22em;color:rgba(243,222,176,.3)}@media(max-width:560px){.card{padding:26px 18px 22px}.style{padding:13px 10px}.row button{padding:0 13px}}</style></head><body><div class="bg"></div><div class="stars"></div><main><div class="card"><h1>✦ 写下一个名字 ✦</h1><div class="sub">选择要送出的花束</div><div class="styles"><button class="style active" data-style="rose"><span>🌹</span><b>星尘玫瑰</b><small>保留原版粒子花束与动画</small></button><button class="style" data-style="sunflower"><span>🌻</span><b>向日葵笑脸杯</b><small>独立 3D Mesh · 更强陀螺仪视差</small></button></div><div class="row"><input id="name" maxlength="12" placeholder="TA 的名字"><button id="go">为 TA 绽放</button></div><div class="tip">两种花束互不影响 · 原版玫瑰保持不动</div></div></main><script>const q=new URLSearchParams(location.search),clean=s=>(s||'').replace(/\s+/g,' ').trim().slice(0,12);let style=['rose','sunflower'].includes(q.get('style'))?q.get('style'):'rose';const direct=clean(q.get('n'));function route(n){const file=style==='sunflower'?'sunflower.html':'rose.html';location.replace(file+'?n='+encodeURIComponent(n)+'&style='+style)}if(direct)route(direct);document.querySelectorAll('.style').forEach(b=>b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('.style').forEach(x=>x.classList.toggle('active',x===b))});const input=document.querySelector('#name');function go(){const n=clean(input.value);if(!n){input.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:350});input.focus();return}route(n)}document.querySelector('#go').onclick=go;input.onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>input.focus(),350)</script></body></html>
