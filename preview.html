<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06050d">
<title>一束花开</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root{
    --gold:#e9b45c; --gold-soft:#f3deb0; --gold-dim:rgba(233,180,92,.45);
    --line:rgba(212,175,90,.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06050d;
    overscroll-behavior:none}
  body{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:#f3deb0;
    -webkit-user-select:none;user-select:none}
  #scene{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}

  /* 暗角 */
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(0,0,0,.34) 82%, rgba(0,0,0,.62) 100%)}

  /* 献词 */
  #dedication{position:fixed;left:50%;bottom:clamp(120px,18vh,220px);transform:translateX(-50%);z-index:3;
    text-align:center;pointer-events:none;opacity:0;filter:blur(10px);padding:0 16px;
    transition:opacity 2.2s ease,filter 2.2s ease,letter-spacing 2.2s ease;letter-spacing:.62em;text-indent:.62em}
  #dedication.show{opacity:1;filter:blur(0);letter-spacing:.3em;text-indent:.3em}
  #dedication .line{font-size:clamp(19px,3.2vw,31px);font-weight:600;
    background:linear-gradient(180deg,#fff3cd 0%,#f0c268 55%,#cf8f43 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(233,180,92,.35))}
  #dedication .sub{margin-top:15px;font-size:10px;letter-spacing:.52em;text-indent:.52em;
    color:rgba(243,222,176,.42);font-family:Georgia,"Times New Roman",serif}

  /* 控件（仅落地页） */

  /* ---- 落地输入页 ---- */
  #landing{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    padding:20px;pointer-events:none;transition:opacity 1.1s ease}
  #landing.gone{opacity:0}
  #landing .card{pointer-events:auto;text-align:center;padding:34px 34px 28px;border-radius:18px;
    border:1px solid var(--line);background:rgba(10,8,18,.6);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 18px 60px rgba(0,0,0,.45);transition:transform 1.1s ease}
  #landing.gone .card{transform:translateY(-16px)}
  #landing .lab{font-size:13px;letter-spacing:.5em;text-indent:.5em;color:var(--gold-dim);margin-bottom:22px}
  #landing .row{display:flex;gap:10px;align-items:center;justify-content:center}
  #landingInput{width:9.5em;height:46px;border:0;outline:0;border-radius:10px;text-align:center;
    background:rgba(233,180,92,.07);color:var(--gold-soft);font-family:inherit;font-size:17px;
    letter-spacing:.12em;caret-color:var(--gold)}
  #landingInput::placeholder{color:rgba(243,222,176,.32)}
  #landingInput.err{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #start{height:46px;padding:0 20px;border-radius:10px;border:1px solid rgba(224,182,102,.5);
    background:rgba(224,182,102,.12);color:#efd9a4;font-family:inherit;font-size:14px;
    letter-spacing:.22em;text-indent:.22em;cursor:pointer;transition:background .25s}
  #start:hover{background:rgba(224,182,102,.26)}
  #landing .tip{margin-top:18px;font-size:10px;letter-spacing:.3em;text-indent:.3em;color:rgba(243,222,176,.35)}

  /* ---- 绽放提示（名字定格后浮现，点击即绽放）---- */
  #cue{position:fixed;left:50%;top:60%;transform:translateX(-50%);z-index:3;pointer-events:none;
    font-size:12px;letter-spacing:.5em;text-indent:.5em;color:rgba(243,222,176,.55);
    opacity:0;transition:opacity 1.6s ease;white-space:nowrap;
    animation:cuePulse 2.6s ease-in-out infinite}
  #cue.show{opacity:1}
  @keyframes cuePulse{0%,100%{text-shadow:0 0 6px rgba(233,180,92,.12)}
    50%{text-shadow:0 0 18px rgba(233,180,92,.5)}}

  /* ---- 重新播放（小刷新图标，右下角）---- */
  #refresh{position:fixed;right:max(18px,calc(2vw + env(safe-area-inset-right)));
    bottom:max(18px,calc(2.4vh + env(safe-area-inset-bottom)));
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:rgba(10,8,18,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:rgba(243,222,176,.6);display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:0;pointer-events:none;z-index:5;padding:0;
    transition:opacity 1s ease,transform .18s ease,background .25s,color .25s}
  #refresh.show{opacity:1;pointer-events:auto}
  #refresh:hover{background:rgba(233,180,92,.14);color:#f3deb0}
  #refresh:active{transform:scale(.88)}
  #refresh svg{width:17px;height:17px;display:block}

  /* ---- 复制提示（轻点复制）---- */
  #toast{position:fixed;left:50%;bottom:calc(max(26px, 3.4vh + env(safe-area-inset-bottom)) + 76px);
    transform:translateX(-50%);z-index:6;font-size:11px;letter-spacing:.3em;text-indent:.3em;
    color:rgba(243,222,176,.85);padding:12px 20px;border-radius:999px;border:1px solid var(--line);
    background:rgba(10,8,18,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    opacity:0;pointer-events:none;transition:opacity .6s ease;white-space:nowrap;max-width:92vw;overflow:hidden}
  #toast.show{opacity:1;pointer-events:auto;cursor:pointer}
  #toast.show:hover{border-color:rgba(233,180,92,.5)}

  /* 加载 */
  #loading{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:22px;
    align-items:center;justify-content:center;background:#06050d;
    transition:opacity 1.1s ease;font-size:12px}
  #loading.hide{opacity:0;pointer-events:none}
  #loading .glyph{font-size:22px;color:var(--gold);animation:bloom 2.1s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(233,180,92,.6))}
  #loading .txt{letter-spacing:.6em;text-indent:.6em;color:rgba(243,222,176,.5)}
  @keyframes bloom{0%,100%{transform:scale(.72) rotate(0deg);opacity:.45}
    50%{transform:scale(1.18) rotate(45deg);opacity:1}}
  #err{max-width:70%;text-align:center;line-height:1.9;color:rgba(243,222,176,.6);display:none}

  /* ---- 手机 / 小屏 ---- */
  @media (max-width:560px){
    #dedication{padding:0 14px}
    #dedication .line{font-size:clamp(17px,4.8vw,22px);line-height:1.9}
    #dedication .sub{font-size:8.5px;letter-spacing:.38em;text-indent:.38em;margin-top:10px}
    #landing .card{padding:26px 20px 22px}
    #landingInput{width:8.5em;height:44px;font-size:16px}
    #start{height:44px;padding:0 16px}
    #toast{font-size:9.5px;letter-spacing:.18em;text-indent:.18em;bottom:12%}
  }
  /* ---- 手机横屏 / 矮屏 ---- */
  @media (max-height:520px){
    #dedication{bottom:calc(env(safe-area-inset-bottom, 0px) + 112px)}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<div id="dedication">
  <div class="line" id="dedLine">愿你的每一天，都如花绽放</div>
  <div class="sub">MAY ALL YOUR DAYS BLOOM</div>
</div>

<div id="landing">
  <div class="card">
    <div class="lab">✦ 写下一个名字 ✦</div>
    <div class="row">
      <input id="landingInput" maxlength="12" spellcheck="false" autocomplete="off" placeholder="TA 的名字">
      <button id="start">为 TA 绽放</button>
    </div>
    <div class="tip">生成专属链接 · 把一束花送给 TA</div>
  </div>
</div>
<div id="cue">✦ 轻触 · 绽放 ✦</div>
<button id="refresh" aria-label="重新播放" title="重新播放">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
    <polyline points="21 3 21 9 15 9"/>
  </svg>
</button>
<div id="toast">✦ 专属链接已生成 · 轻点此处复制</div>

<div id="loading">
  <div class="glyph">✦</div>
  <div class="txt">正在绽放</div>
  <div id="err"></div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   配置
============================================================ */
const DEDICATION   = '愿你的每一天，都如花绽放';
const FONT_STACK   = '"Noto Serif SC","Songti SC","STSong","SimSun",serif';
const sanitizeName = s => (s || '').replace(/\s+/g, ' ').trim().slice(0, 12);
const NAME_Y       = 1.5;               // 名字在世界坐标的中心高度
const T_ASSEMBLE   = 2.6;               // 星尘 -> 名字（名字定格后等待点击绽放）
const T_MORPH      = 3.7;               // 点击后：碎裂消散 -> 花束
let morphStart = Infinity;              // 点击绽放的时刻（Infinity = 尚未点击）

const coarse = matchMedia('(pointer:coarse)').matches;   // 触屏：用陀螺仪视差；桌面：用鼠标
const isMobile = coarse || innerWidth < 760;
const COUNT    = isMobile ? 13000 : 30000;
const sizeScaleForHeight = h => Math.min(0.13, Math.max(0.045, 0.015 * h / Math.sqrt(COUNT)));

const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
let currentName = sanitizeName(qs.get('n'));   // 带尾巴的链接直接进播放，否则落地输入页
let started = !!currentName;

/* ============================================================
   字体（Google Fonts 按 text= 子集化，秒加载；失败则退回系统衬线）
============================================================ */
const loadedFontChars = new Set();
async function loadFonts(){
  try{
    const chars = [...new Set((currentName + DEDICATION + '再绽放换名正在重输回车✦写下一个为她的专属链接生成把束花送给复制已'))].join('');
    [...chars].forEach(c => loadedFontChars.add(c));
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&text='
              + encodeURIComponent(chars) + '&display=swap';
    document.head.appendChild(link);
    await Promise.race([
      Promise.all([
        document.fonts.load('900 200px "Noto Serif SC"', currentName || chars),
        document.fonts.load('600 16px "Noto Serif SC"', DEDICATION),
      ]),
      new Promise(r => setTimeout(r, 2600))
    ]);
  }catch(e){ /* 离线也能跑 */ }
}

/* 动态补载名字字形子集，保证任何名字都用衬线字形渲染 */
async function ensureNameFont(name){
  try{
    const chars = [...new Set(name)].filter(c => !loadedFontChars.has(c));
    if (!chars.length) return;
    chars.forEach(c => loadedFontChars.add(c));
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&text='
              + encodeURIComponent(chars.join('')) + '&display=swap';
    document.head.appendChild(link);
    await Promise.race([
      Promise.all([
        document.fonts.load('900 200px "Noto Serif SC"', name),
        document.fonts.load('600 16px "Noto Serif SC"', name),
      ]),
      new Promise(r => setTimeout(r, 2200))
    ]);
  }catch(e){}
}

/* ============================================================
   工具
============================================================ */
const CR  = (a, b) => a + Math.random() * (b - a);
const clamp01 = t => Math.min(1, Math.max(0, t));
const smooth01 = t => { t = clamp01(t); return t * t * (3 - 2 * t); };
const lerp3 = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const jit3 = (c, j) => [c[0]+CR(-j,j), c[1]+CR(-j,j), c[2]+CR(-j,j)];
const norm3 = v => { const l = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const cross3 = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

/* ============================================================
   名字采样：离屏 canvas 逐像素取点 -> 世界坐标
============================================================ */
function sampleName(name, worldW){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d', { willReadFrequently:true });
  const probe = s => { ctx.font = `900 ${s}px ${FONT_STACK}`; return ctx.measureText(name).width; };
  let fs = 300;
  const w300 = probe(fs);
  if (w300 > 1560) fs = Math.max(64, 1560 / (w300 / 300));
  const tw = probe(fs);
  c.width  = Math.ceil(tw + 120);
  c.height = Math.ceil(fs * 1.5);
  ctx.font = `900 ${fs}px ${FONT_STACK}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(name, c.width / 2, c.height / 2);

  const img = ctx.getImageData(0, 0, c.width, c.height).data;
  const cand = [];
  for (let y = 0; y < c.height; y++)
    for (let x = 0; x < c.width; x++)
      if (img[(y * c.width + x) * 4 + 3] > 140) cand.push(x, y);

  const k = worldW / c.width;
  const pos = new Float32Array(COUNT * 3);
  const n = cand.length / 2;
  let yMin = 1e9, yMax = -1e9;
  for (let i = 0; i < COUNT; i++){
    const j = (Math.random() * n) | 0;
    const px = cand[j*2]   + CR(-0.7, 0.7);
    const py = cand[j*2+1] + CR(-0.7, 0.7);
    const wx = (px - c.width / 2) * k;
    const wy = -(py - c.height / 2) * k + NAME_Y;
    pos[i*3] = wx; pos[i*3+1] = wy; pos[i*3+2] = CR(-0.3, 0.3);
    if (wy < yMin) yMin = wy; if (wy > yMax) yMax = wy;
  }
  return { pos, yMin, yMax };
}

/* 香槟金：上亮下深 + 少量星芒白 */
function nameColorAt(y, yMin, yMax, out, i){
  const t = clamp01((y - yMin) / Math.max(0.001, yMax - yMin));
  let col = t < 0.5
    ? lerp3([1.00,0.95,0.80], [0.95,0.76,0.42], t * 2)
    : lerp3([0.95,0.76,0.42], [0.79,0.53,0.24], (t - 0.5) * 2);
  if (Math.random() < 0.055) col = [1.0, 0.985, 0.92];
  out[i*3] = col[0]; out[i*3+1] = col[1]; out[i*3+2] = col[2];
}

/* ============================================================
   花束程序化建模（黄金角玫瑰 / 满天星 / 花茎 / 叶 / 包装 / 金缎带）
============================================================ */
function buildBouquet(){
  const parts = { pos:[], col:[], role:[] };
  const add = (x,y,z,c,rl=0) => { parts.pos.push(x,y,z); parts.col.push(c[0],c[1],c[2]); parts.role.push(rl); };

  const grip = [0, -1.72, 0];
  const domeC = [0, 2.15, 0.25];

  /* ---- 玫瑰：13 朵，三种色调 ---- */
  const TONES = {
    0: { c:[0.84,0.09,0.22], m:[0.97,0.30,0.40], e:[1.00,0.60,0.68] },  // 绯红
    1: { c:[0.93,0.55,0.66], m:[1.00,0.77,0.83], e:[1.00,0.92,0.94] },  // 粉白
    2: { c:[0.40,0.028,0.13],m:[0.64,0.075,0.22],e:[0.90,0.30,0.42] },  // 丝绒深红
  };
  const roses = [
    { p:[ 0.00, 2.98, 0.50], R:1.02, t:0 },
    { p:[-1.32, 2.48, 0.78], R:0.80, t:0 },
    { p:[ 1.30, 2.52, 0.72], R:0.78, t:1 },
    { p:[-0.56, 2.12, 1.08], R:0.72, t:0 },
    { p:[ 0.64, 2.16, 1.02], R:0.70, t:2 },
    { p:[-1.88, 1.78, 0.10], R:0.62, t:0 },
    { p:[ 1.86, 1.82, 0.05], R:0.64, t:1 },
    { p:[-1.06, 1.36, 0.58], R:0.58, t:0 },
    { p:[ 1.10, 1.32, 0.52], R:0.56, t:2 },
    { p:[-0.16, 1.55,-0.78], R:0.55, t:1 },
    { p:[ 0.56, 2.88,-0.62], R:0.52, t:0 },
    { p:[-0.74, 2.82,-0.58], R:0.50, t:2 },
    { p:[ 0.06, 2.32, 1.38], R:0.50, t:1 },
  ];

  const roseN = Math.floor(COUNT * 0.46);
  const wSum = roses.reduce((s,r) => s + r.R * r.R, 0);
  for (const rose of roses){
    const n = Math.floor(roseN * rose.R * rose.R / wSum);
    const tone = TONES[rose.t];
    /* 花头朝向：前排迎镜头，后排朝外前 */
    let nn = rose.p[2] < 0.1
      ? [rose.p[0]*0.55, 0.40, 0.72]
      : [rose.p[0]*0.28, 0.14 + (rose.p[1]-2.4)*0.18, 0.94];
    nn = norm3(nn);
    let u = cross3(nn, [0,1,0]);
    if (Math.hypot(...u) < 1e-4) u = [1,0,0]; else u = norm3(u);
    const v = cross3(nn, u);

    for (let i = 0; i < n; i++){
      const q  = Math.sqrt((i + 0.5) / n);            // 半径比例 0..1
      const th = i * 2.39996323;                      // 黄金角 137.5°
      const rr = rose.R * q * (1 + CR(-0.03,0.03));
      const lift = rose.R * (0.5 * (1 - q*q) - 0.10 * q*q) + CR(-0.02,0.02);
      const ct = Math.cos(th), st = Math.sin(th);
      add(
        rose.p[0] + u[0]*rr*ct + v[0]*rr*st + nn[0]*lift,
        rose.p[1] + u[1]*rr*ct + v[1]*rr*st + nn[1]*lift,
        rose.p[2] + u[2]*rr*ct + v[2]*rr*st + nn[2]*lift,
        roseColor(tone, q)
      );
    }
  }
  function roseColor(tone, q){
    let col = q < 0.45
      ? lerp3(tone.c, tone.m, q / 0.45)
      : lerp3(tone.m, tone.e, (q - 0.45) / 0.55);
    col = jit3(col, 0.035);
    if (q > 0.85 && Math.random() < 0.12) col = [1.0, 0.86, 0.9];  // 边缘瓣尖高光
    return col;
  }

  /* ---- 花茎：贝塞尔汇聚到握点 ---- */
  const stemN = Math.floor(COUNT * 0.11);
  const perStem = Math.floor(stemN / roses.length);
  for (const rose of roses){
    const b = [rose.p[0]*0.96, rose.p[1] - rose.R*0.62, rose.p[2]*0.96];
    const cpx = [b[0]*0.45, (b[1] + grip[1])/2 + 0.32, b[2]*0.45];
    for (let i = 0; i < perStem; i++){
      const t = CR(0.06, 0.97);
      const it = 1 - t;
      const x = it*it*b[0] + 2*it*t*cpx[0] + t*t*grip[0] + CR(-0.035,0.035);
      const y = it*it*b[1] + 2*it*t*cpx[1] + t*t*grip[1] + CR(-0.035,0.035);
      const z = it*it*b[2] + 2*it*t*cpx[2] + t*t*grip[2] + CR(-0.035,0.035);
      add(x, y, z, jit3(lerp3([0.235,0.475,0.265],[0.135,0.30,0.175], t), 0.03));
    }
  }

  /* ---- 叶片 ---- */
  const leafN = Math.floor(COUNT * 0.07);
  for (let i = 0; i < leafN; i++){
    const rose = roses[(Math.random()*roses.length)|0];
    const b = [rose.p[0]*0.96, rose.p[1] - rose.R*0.62, rose.p[2]*0.96];
    const cpx = [b[0]*0.45, (b[1]+grip[1])/2 + 0.32, b[2]*0.45];
    const t = CR(0.30, 0.62), it = 1 - t;
    const ox = it*it*b[0] + 2*it*t*cpx[0] + t*t*grip[0];
    const oy = it*it*b[1] + 2*it*t*cpx[1] + t*t*grip[1];
    const oz = it*it*b[2] + 2*it*t*cpx[2] + t*t*grip[2];
    const d = norm3([ox*1.25 + CR(-0.3,0.3), CR(-0.28,0.34), oz*0.5 + CR(-0.15,0.6)]);
    const w = norm3(cross3(d, [CR(-1,1), CR(-1,1), CR(-1,1)]));
    const L = CR(0.5, 0.8), W = L * CR(0.26, 0.36);
    const tt = Math.random();
    const lat = (Math.random()*2 - 1);
    const wid = W * Math.pow(Math.sin(Math.PI * Math.min(tt*0.92+0.04, 1)), 0.7);
    add(ox + d[0]*tt*L + w[0]*lat*wid, oy + d[1]*tt*L + w[1]*lat*wid, oz + d[2]*tt*L + w[2]*lat*wid,
        jit3(lerp3([0.16,0.40,0.215],[0.34,0.585,0.36], tt), 0.035));
  }

  /* ---- 满天星：花簇外壳上的白色微粒 ---- */
  const bbN = Math.floor(COUNT * 0.08);
  const clusters = 64;
  for (let ci = 0; ci < clusters; ci++){
    const a  = CR(0, Math.PI*2);
    const ph = Math.acos(CR(0.10, 0.96));
    const rr = CR(2.02, 2.72);
    const cx = domeC[0] + rr*Math.sin(ph)*Math.cos(a);
    const cy = domeC[1] + rr*Math.cos(ph)*0.85;
    const cz = domeC[2] + rr*Math.sin(ph)*Math.sin(a)*0.85 + 0.25;
    const n = Math.floor(bbN / clusters);
    for (let i = 0; i < n; i++){
      add(cx + gauss()*0.09, cy + gauss()*0.09, cz + gauss()*0.09,
          jit3([1.0, 0.965, 0.885], 0.03));
    }
  }
  function gauss(){ return (Math.random()+Math.random()+Math.random()-1.5) * 0.8; }

  /* ---- 包装：牛皮纸锥 + 奶油内衬 ---- */
  const wrapN = Math.floor(COUNT * 0.10);
  for (let i = 0; i < wrapN; i++){
    const t = Math.pow(Math.random(), 0.85);
    const y = -1.55 - t * 2.15;
    let r = 0.72 + 0.95 * Math.pow(Math.min(t/0.8, 1), 0.8);
    const tipT = Math.max((t - 0.8)/0.2, 0);
    r *= 1 - 0.82 * tipT * tipT;
    const a = CR(0, Math.PI*2);
    const lum = 0.74 + 0.26 * Math.max(0, Math.cos(a - 0.6));
    let col = [0.80*lum, 0.675*lum, 0.475*lum];
    if (y > -1.74 && Math.random() < 0.32) col = [0.93, 0.875, 0.76];
    add(Math.cos(a)*r + CR(-0.02,0.02), y + CR(-0.02,0.02), Math.sin(a)*r*0.94 + CR(-0.02,0.02),
        jit3(col, 0.025));
  }

  /* ---- 金缎带：环 + 前结 + 双飘带 ---- */
  const ribN = Math.floor(COUNT * 0.035);
  for (let i = 0; i < ribN; i++){
    const pick = Math.random();
    let x, y, z, col;
    if (pick < 0.62){                                   // 环
      const a = CR(0, Math.PI*2), b = CR(0, Math.PI*2);
      const R = 0.62 + 0.10*Math.cos(b);
      x = Math.cos(a)*R; z = Math.sin(a)*R*0.95; y = -1.66 + 0.09*Math.sin(b)*0.8;
      col = [1.0, 0.84, 0.46];
    } else if (pick < 0.80){                            // 前结
      x = gauss()*0.13; y = -1.66 + gauss()*0.11; z = 0.55 + gauss()*0.09;
      col = [1.0, 0.90, 0.55];
    } else {                                            // 双飘带
      const s = Math.random() < 0.5 ? 0.42 : -0.42;
      const t = CR(0, 1);
      const rr = 0.62*(1-t*0.72);
      x = Math.cos(s)*rr + CR(-0.03,0.03); z = Math.sin(s)*rr;
      y = -1.72 - t*0.78 + Math.sin(t*5)*0.03;
      col = lerp3([1.0,0.85,0.48],[0.92,0.70,0.36], t);
    }
    add(x, y, z, jit3(col, 0.04));
  }

  /* ---- 飘落花瓣（role=1，成形后从花束顶部徐徐飘落）---- */
  const petalN = Math.floor(COUNT * 0.055);
  for (let i = 0; i < petalN; i++){
    const a = CR(0, Math.PI*2), ph = Math.acos(CR(0.15, 0.9)), rr = CR(1.6, 2.6);
    add(domeC[0] + rr*Math.sin(ph)*Math.cos(a),
        domeC[1] + rr*Math.cos(ph),
        domeC[2] + rr*Math.sin(ph)*Math.sin(a)*0.8,
        jit3(lerp3([1.0,0.60,0.70],[1.0,0.80,0.85], Math.random()), 0.03), 1);
  }

  /* ---- 光尘：花束周身淡金微尘，补满余量 ---- */
  while (parts.role.length < COUNT){
    const a = CR(0, Math.PI*2), ph = Math.acos(CR(-0.35, 0.98)), rr = CR(2.4, 3.4);
    const b = Math.random() * 0.55;
    add(domeC[0] + rr*Math.sin(ph)*Math.cos(a),
        domeC[1] + 0.6 + rr*Math.cos(ph)*0.9,
        domeC[2] + rr*Math.sin(ph)*Math.sin(a)*0.85,
        [0.92*b+0.35, 0.76*b+0.27, 0.5*b+0.14]);
  }

  return {
    pos:  new Float32Array(parts.pos.slice(0, COUNT*3)),
    col:  new Float32Array(parts.col.slice(0, COUNT*3)),
    role: new Float32Array(parts.role.slice(0, COUNT)),
  };
}

/* ============================================================
   Three.js 场景
============================================================ */
const canvas = $('#scene');
const DPR_CAP = isMobile ? 1.75 : 2;           // 移动端限像素比，保帧率省电
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, DPR_CAP));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 120);

/* ---- 背景：径向渐变夜空 + 微星 ---- */
const bgMat = new THREE.ShaderMaterial({
  depthWrite:false, depthTest:false,
  uniforms:{ uTime:{ value:0 } },
  vertexShader:`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
  fragmentShader:`
    varying vec2 vUv;
    uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      vec3 col = mix(vec3(0.0015,0.0012,0.0045), vec3(0.0045,0.0040,0.0115), smoothstep(0.0,1.0,uv.y));
      float g = exp(-pow(length((uv - vec2(0.5,0.44)) * vec2(1.55,1.25)), 2.0) * 3.0);
      col += vec3(0.013,0.0075,0.022) * g * 0.6;
      vec2 gp = uv * vec2(200.0, 118.0);
      vec2 id = floor(gp);
      float rnd = hash(id);
      float star = smoothstep(0.14, 0.0, length(fract(gp) - 0.5)) * step(0.9962, rnd);
      col += star * (0.08 + 0.06 * sin(uTime * 1.7 + rnd * 40.0)) * vec3(0.85,0.87,1.0);
      col *= 1.0 - 0.5 * pow(min(length(uv - 0.5) * 1.42, 1.0), 2.3);
      gl_FragColor = vec4(col, 1.0);
    }`
});
const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgMesh.frustumCulled = false;
bgMesh.renderOrder = -10;
scene.add(bgMesh);

/* ---- 粒子系统 ---- */
const geo = new THREE.BufferGeometry();
const aName   = new Float32Array(COUNT*3);
const aNameC  = new Float32Array(COUNT*3);
const bouquet = buildBouquet();
const aSeed   = new Float32Array(COUNT);
const aSize   = new Float32Array(COUNT);
for (let i = 0; i < COUNT; i++){
  aSeed[i] = Math.random();
  aSize[i] = bouquet.role[i] > 0.5 ? CR(1.5, 2.3)
           : (Math.random() < 0.12 ? CR(1.9, 2.7) : CR(0.8, 1.5));
}
geo.setAttribute('position',  new THREE.BufferAttribute(aName, 3));
geo.setAttribute('aNameColor',new THREE.BufferAttribute(aNameC, 3));
geo.setAttribute('aFlowerPos',new THREE.BufferAttribute(bouquet.pos, 3));
geo.setAttribute('aFlowerColor',new THREE.BufferAttribute(bouquet.col, 3));
geo.setAttribute('aSeed',     new THREE.BufferAttribute(aSeed, 1));
geo.setAttribute('aSize',     new THREE.BufferAttribute(aSize, 1));
geo.setAttribute('aRole',     new THREE.BufferAttribute(bouquet.role, 1));

const uniforms = {
  uTime:{ value:0 }, uAssemble:{ value:0 }, uProgress:{ value:0 },
  uBurst:{ value:0 }, uBouquet:{ value:0 },
  uPixelRatio:{ value:Math.min(devicePixelRatio, DPR_CAP) },
  /* 点尺寸 ∝ 屏高/√粒子数：保证各设备加色覆盖率一致，避免过曝或稀疏 */
  uSizeScale:{ value: sizeScaleForHeight(innerHeight) },
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uAssemble, uProgress, uBurst, uBouquet;
    uniform float uPixelRatio, uSizeScale;
    attribute vec3 aFlowerPos;
    attribute vec3 aNameColor;
    attribute vec3 aFlowerColor;
    attribute float aSeed;
    attribute float aSize;
    attribute float aRole;
    varying vec3 vColor;
    varying float vAlpha;
    const float PI = 3.14159265;
    vec3 hash3(float n){
      return fract(sin(vec3(n, n+1.7, n+3.3)) * vec3(43758.5453, 22578.1459, 19642.3490));
    }
    void main(){
      vec3 h = hash3(aSeed * 91.7 + 0.13);

      /* 名字形态：呼吸微浮 */
      vec3 nameP = position;
      nameP.x += sin(uTime * 0.85 + aSeed * 40.0) * 0.022;
      nameP.y += cos(uTime * 1.05 + aSeed * 55.0) * 0.028;

      /* 变形进度：每颗粒子有随机延迟与时长（碎裂有先后） */
      float m = clamp((uProgress - fract(aSeed * 13.73) * 0.45) / 0.55, 0.0, 1.0);
      float e = m * m * (3.0 - 2.0 * m);
      e = e * e * (3.0 - 2.0 * e);

      /* 花束形态：成形后随风轻曳 */
      vec3 flowerP = aFlowerPos;
      flowerP.x += sin(uTime * 0.72 + aFlowerPos.y * 0.65) * 0.05 * e * uBouquet;
      flowerP.z += cos(uTime * 0.58 + aFlowerPos.x * 0.60) * 0.04 * e * uBouquet;

      /* 主路径 名字 -> 花 */
      vec3 p = mix(nameP, flowerP, e);
      float mid = sin(PI * e);

      /* 消散：径向炸开 + 湍流 + 旋涡 */
      vec3 outDir = normalize(position - vec3(0.0, 1.4, 0.0) + (h - 0.5) * 0.8);
      float amp = mid * uBurst * (0.7 + h.x * 2.1);
      vec3 turb = vec3(
        sin(aSeed * 61.0 + uTime * 2.2 + position.y * 2.1),
        cos(aSeed * 47.0 + uTime * 1.8 + position.x * 1.9),
        sin(aSeed * 83.0 + uTime * 2.6 + position.x * 2.4));
      p += outDir * amp * 1.55 + turb * amp * 0.95;

      vec3 rel = p - vec3(0.0, 1.2, 0.0);
      float sw = mid * uBurst * (h.y - 0.5) * 2.6;
      float cs = cos(sw); float sn = sin(sw);
      p = vec3(0.0, 1.2, 0.0) + vec3(rel.x*cs - rel.z*sn, rel.y, rel.x*sn + rel.z*cs);

      /* 弧线轨迹 */
      vec3 flyDir = normalize(aFlowerPos - position + vec3(0.001));
      vec3 perp = normalize(cross(flyDir, vec3(0.0, 1.0, 0.0)) + vec3(0.001, 0.0, 0.0));
      p += perp * mid * (h.z - 0.5) * 2.6;

      /* 开场：星尘凝聚成名字 */
      float la = clamp(uAssemble * 1.45 - aSeed * 0.45, 0.0, 1.0);
      la = 1.0 - pow(1.0 - la, 3.0);
      vec3 dust = (h * 2.0 - 1.0) * vec3(26.0, 16.0, 10.0) + vec3(0.0, 0.6, -4.0);
      dust += (h - 0.5) * (sin(uTime * 0.12 + h.x * 6.283) * 1.4 + 0.6);
      p = mix(dust, p, la);

      /* 飘落花瓣 */
      float petalA = 1.0;
      if (aRole > 0.5){
        float s2 = fract(aSeed * 7.31);
        float ph = fract(uTime * (0.04 + 0.05 * s2) + s2);
        vec3 fp = vec3(
          aFlowerPos.x * 0.4 + sin(uTime * 0.6 + s2 * 40.0 + ph * 5.0) * 0.95,
          5.1 - ph * 9.2,
          aFlowerPos.z * 0.4 + cos(uTime * 0.45 + s2 * 60.0) * 0.7);
        p = mix(p, fp, uBouquet);
        petalA = smoothstep(0.0, 0.07, ph) * (1.0 - smoothstep(0.78, 1.0, ph));
      }

      /* 颜色：金 -> 花色，中途微燃 */
      float cm = smoothstep(0.08, 0.92, e);
      vec3 col = mix(aNameColor, aFlowerColor, cm);
      col += mid * 0.25;
      vColor = col;

      float tw = 0.74 + 0.26 * sin(uTime * (1.6 + h.x * 2.6) + aSeed * 40.0);
      float alpha = tw * mix(1.0, petalA, uBouquet);
      alpha *= 1.0 - mid * 0.55;
      alpha *= mix(0.12, 1.0, la);
      float wave = 0.82 + 0.18 * sin(position.x * 1.1 - uTime * 1.6 + aSeed * 2.0);
      alpha *= mix(1.0, wave, (1.0 - uProgress) * la);
      vAlpha = alpha;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float sz = aSize * uSizeScale * (1.0 + mid * 0.75) * (0.8 + h.y * 0.5) * mix(0.95, 1.0, e);
      gl_PointSize = clamp(sz * uPixelRatio * (320.0 / -mv.z), 1.0, 110.0);
    }`,
  fragmentShader:`
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.05, d);
      float core = smoothstep(0.16, 0.0, d);
      gl_FragColor = vec4(vColor * (0.62 + core * 0.9), a * vAlpha * 0.6);
    }`
});
const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);

/* ---- 辉光后期 ---- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.18);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* 调试参数：?nobloom 关辉光 / ?bgonly 只看背景 */
try{

  if (Q.has('nobloom')) bloom.enabled = false;
  if (Q.has('bgonly'))  points.visible = false;

/* ============================================================
   名字重建 / 尺寸
============================================================ */
let worldW = 9.6, baseZ = 12;
function computeLayout(){
  const w = innerWidth, h = innerHeight, aspect = w / h;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  worldW = Math.min(9.6, Math.max(4.2, aspect * 10.2));
  uniforms.uSizeScale.value = sizeScaleForHeight(h);
  const tanF = Math.tan(THREE.MathUtils.degToRad(22.5));
  baseZ = Math.min(34, Math.max(4.7 / tanF, (5.4 / aspect) / tanF, 11.5));
}
function rebuildName(){
  if (!currentName) return;
  const { pos, yMin, yMax } = sampleName(currentName, worldW);
  aName.set(pos);
  for (let i = 0; i < COUNT; i++) nameColorAt(pos[i*3+1], yMin, yMax, aNameC, i);
  geo.attributes.position.needsUpdate = true;
  geo.attributes.aNameColor.needsUpdate = true;
}
computeLayout();
if (currentName) rebuildName();

/* ============================================================
   时间线 & 主循环
============================================================ */
let t = 0, clock = 0, last = performance.now();
let mx = 0, my = 0, camX = 0, camY = 0;
let oriX = 0, oriY = 0;          // 重力感应视差目标（手机）
/* 启用陀螺仪视差：iOS 需在用户手势内请求权限，Android 直接监听 */
let oriOn = false;
function enableOrientation(){
  if (oriOn) return;
  const D = window.DeviceOrientationEvent;
  if (!D) return;
  const attach = () => {
    oriOn = true;
    addEventListener('deviceorientation', e => {
      if (e.gamma == null || e.beta == null) return;
      const nx = Math.max(-1, Math.min(1, e.gamma / 35));          // 左右倾 ±35° -> ±1
      const ny = Math.max(-1, Math.min(1, (e.beta - 65) / 30));    // 前后倾，以正常握持(~65°)为中心
      oriX += (nx - oriX) * 0.12;
      oriY += (ny - oriY) * 0.12;
    });
  };
  if (typeof D.requestPermission === 'function'){
    D.requestPermission().then(s => { if (s === 'granted') attach(); }).catch(() => {});
  } else {
    attach();
  }
}
let dedicated = false;

const dedicationEl = $('#dedication'), cueEl = $('#cue'), refreshEl = $('#refresh');

function restart(){
  t = 0; dedicated = false; morphStart = Infinity;
  uniforms.uAssemble.value = 0;
  uniforms.uProgress.value = 0;
  uniforms.uBurst.value = 0;
  uniforms.uBouquet.value = 0;
  dedicationEl.classList.remove('show');
  cueEl.classList.remove('show');
  refreshEl.classList.remove('show');
}
/* 名字相关的 URL / 标题 / 献词 全部同步 */
function syncMeta(){
  const u = new URL(location);
  u.searchParams.set('n', currentName);
  history.replaceState(null, '', u);
  document.title = `${currentName} · 一束花开`;
  $('#dedLine').textContent = `${currentName}，${DEDICATION}`;
}

addEventListener('resize', () => { computeLayout(); rebuildName(); });
addEventListener('pointermove', e => {
  mx = (e.clientX / innerWidth) * 2 - 1;
  my = -((e.clientY / innerHeight) * 2 - 1);
});
canvas.addEventListener('pointerdown', () => {
  enableOrientation();             // 借助本次手势，顺带申请 iOS 陀螺仪权限
  /* 名字定格后：轻触/点击 -> 绽放（唯一的主动作） */
  if (started && morphStart === Infinity && t > T_ASSEMBLE + 0.25){
    morphStart = t + 0.35;
    cueEl.classList.remove('show');
  }
});
refreshEl.addEventListener('click', () => { if (started) restart(); });

/* ---- 落地页：输入名字 -> 生成带尾巴的专属链接 ---- */
const landingEl = $('#landing'), landingInput = $('#landingInput'), toastEl = $('#toast');
const TOAST_TEXT = '✦ 专属链接已生成 · 轻点此处复制';
let toastTimer = 0;

async function copyUrl(){
  const url = location.href;
  try{ await navigator.clipboard.writeText(url); return true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }catch(e2){ return false; }
  }
}

async function beginPlay(){
  enableOrientation();             // 落地页提交也是用户手势，提前申请陀螺仪权限
  const n = sanitizeName(landingInput.value);
  if (!n){
    landingInput.classList.remove('err'); void landingInput.offsetWidth;
    landingInput.classList.add('err');
    landingInput.focus();
    return;
  }
  currentName = n;
  syncMeta();
  copyUrl();                                    // 趁用户手势还在，静默尝试自动复制
  await ensureNameFont(n);
  rebuildName();
  landingEl.classList.add('gone');
  setTimeout(() => landingEl.remove(), 1200);
  restart();
  started = true;
  toastEl.textContent = TOAST_TEXT;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 6000);
}
$('#start').addEventListener('click', beginPlay);
landingInput.addEventListener('keydown', e => { if (e.key === 'Enter') beginPlay(); });

/* 轻点 toast 复制专属链接 */
toastEl.addEventListener('click', async () => {
  const ok = await copyUrl();
  toastEl.textContent = ok ? '✦ 已复制 · 去分享吧' : '✦ 请从地址栏复制链接';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
    toastEl.textContent = TOAST_TEXT;
  }, 2200);
});

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  if (dt > 0.5) dt = 0.016;   // 只吸收切页大跳变，弱 GPU 仍保持真实节奏
  last = now;
  clock += dt;
  if (started) t += dt;       // 落地页待机：星尘漂浮，时间轴不走

  uniforms.uTime.value = clock;
  uniforms.uAssemble.value = clamp01(t / T_ASSEMBLE);
  const prog = morphStart === Infinity ? 0 : clamp01((t - morphStart) / T_MORPH);
  uniforms.uProgress.value = prog;
  uniforms.uBurst.value = (prog > 0 && prog < 1) ? 1 : 0;
  uniforms.uBouquet.value = morphStart === Infinity ? 0 : smooth01((t - morphStart - T_MORPH - 0.25) / 1.6);
  bgMat.uniforms.uTime.value = clock;

  /* 名字定格 -> 浮现「轻触绽放」提示；绽放完成 -> 献词 + 重播按钮 */
  if (started && morphStart === Infinity && t > T_ASSEMBLE + 0.7) cueEl.classList.add('show');
  if (!dedicated && morphStart !== Infinity && t > morphStart + T_MORPH + 1.15){
    dedicated = true; dedicationEl.classList.add('show');
  }
  if (started && t > T_ASSEMBLE + 0.4) refreshEl.classList.add('show');

  window.__rose = { t, started, p: uniforms.uProgress.value, q: uniforms.uBouquet.value, cx: camera.position.x, cy: camera.position.y };
  /* 相机：开场推镜 + 鼠标视差（轻微，不扰动粒子） */
  /* 触屏走陀螺仪视差，桌面走鼠标；都带出花束 3D 纵深 */
  const pX = coarse ? oriX : mx;
  const pY = coarse ? oriY : my;
  camX += (pX * 1.05 - camX) * 0.045;
  camY += (pY * 0.62 - camY) * 0.045;
  const push = 1 + 0.25 * (1 - smooth01(t / 3.4));
  camera.position.set(camX, 0.9 + camY, baseZ * push);
  camera.lookAt(0, 0.9, 0);

  composer.render();
}

/* ============================================================
   启动
============================================================ */
(async () => {
  try{
    await loadFonts();
    if (currentName) rebuildName();     // 字体就绪后重新采样，字形才完整
  }catch(e){}
  if (started){
    syncMeta();                         // 带尾巴链接直达：标题/献词就位，直接播放
    landingEl.remove();                 // 直达模式不显示输入卡片
  } else {
    setTimeout(() => landingInput.focus(), 500);
  }
  requestAnimationFrame(now => { last = now; frame(now); });
  setTimeout(() => $('#loading').classList.add('hide'), 350);
})();
</script>
